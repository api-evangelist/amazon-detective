  - type: Features
    data:
      - name: Behavior Graph Analysis
        description: >-
          Automatically builds a behavior graph from log data using machine learning and graph theory to visualize
          security issues.
      - name: Security Investigations
        description: >-
          Start and manage structured investigations on IAM users and roles with scoped time ranges and severity
          scoring.
      - name: Indicators of Compromise
        description: >-
          Automatically identifies indicators including impossible travel, flagged IP addresses, new geolocations, new
          user agents, and TTP observations.
      - name: Multi-Account Support
        description: Aggregate security data from multiple AWS accounts using an administrator account and member account model.
      - name: AWS Organizations Integration
        description: Automatically enable new organization accounts as member accounts in the organization behavior graph.
      - name: Data Source Packages
        description: >-
          Ingest security telemetry from CloudTrail, VPC Flow Logs, GuardDuty findings, EKS audit logs, and Active
          Directory audit logs.
      - name: Interactive Visualizations
        description: >-
          Provides interactive graph visualizations in the AWS console to explore entity relationships and security
          events.
      - name: Investigation Severity Scoring
        description: >-
          Assigns severity levels (Informational, Low, Medium, High, Critical) based on likelihood and impact of
          compromise indicators.
  - type: UseCases
    data:
      - name: Security Incident Investigation
        description: >-
          Rapidly investigate security incidents by analyzing entity behavior, network activity, and API call patterns
          across your AWS environment.
      - name: Threat Hunting
        description: >-
          Proactively search for suspicious activity and potential threats using behavior analysis and machine learning
          across your AWS accounts.
      - name: Root Cause Analysis
        description: >-
          Identify the root cause of security issues by exploring the relationships between resources, users, and events
          in a behavior graph.
      - name: Compliance Forensics
        description: >-
          Collect and preserve forensic evidence for compliance investigations using structured investigations with
          defined scope and time ranges.
      - name: Multi-Account Security Operations
        description: Centrally manage security investigations across an AWS Organization from a single administrator account.
  - type: Integrations
    data:
      - name: Amazon GuardDuty
        description: Automatically ingests GuardDuty findings into the behavior graph for deeper investigation context.
      - name: AWS CloudTrail
        description: Ingests CloudTrail API call logs to track user and service activity across your AWS environment.
      - name: Amazon VPC Flow Logs
        description: Analyzes VPC flow logs to identify network communication patterns and anomalies.
      - name: Amazon EKS
        description: Optionally ingests EKS audit logs to monitor Kubernetes API server activity.
      - name: AWS Organizations
        description: Integrates with AWS Organizations to manage multi-account behavior graphs and auto-enable new accounts.
      - name: AWS Security Hub
        description: Surfaces Detective investigation context within Security Hub for consolidated security findings.
  - type: Integrations
    url: https://aws.amazon.com/marketplace
