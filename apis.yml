name: Amazon Detective
description: >-
  Amazon Detective is a security investigation service that makes it easy to analyze, investigate, and quickly identify
  the root cause of potential security issues or suspicious activities. It automatically collects log data from your AWS
  resources and uses machine learning, statistical analysis, and graph theory to build interactive visualizations that
  help you conduct faster and more efficient security investigations.
